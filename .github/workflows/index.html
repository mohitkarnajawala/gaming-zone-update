<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming Zone App - Download</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #0d0d0d 0%, #000000 100%);
      color: #e0e0e0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-top: 40px;
      text-align: center;
      position: relative;
    }

    header img {
      max-width: 280px;
      height: auto;
      filter: drop-shadow(0 0 25px #00fff7) drop-shadow(0 0 50px #ff00ff);
    }

    h1 {
      font-size: 2.4em;
      color: #00fff7;
      text-shadow: 0 0 15px #00fff7, 0 0 30px #00fff7;
      margin-top: 15px;
    }

    .reflection {
      margin-top: -20px;
      transform: scaleY(-1);
      opacity: 0.2;
      filter: blur(6px);
    }

    .version {
      font-size: 1.2em;
      margin: 20px 0;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    .download-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #00fff7;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1em;
      box-shadow: 0 0 20px #00fff7, 0 0 40px #00fff7;
      transition: transform 0.2s ease-in-out;
      animation: pulse 2s infinite;
    }

    .download-btn:hover {
      transform: scale(1.05);
      background: #ff00ff;
      box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
      color: #fff;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 20px #00fff7; }
      50% { box-shadow: 0 0 40px #ff00ff; }
      100% { box-shadow: 0 0 20px #00fff7; }
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
      margin-top: 40px;
      width: 90%;
      max-width: 1000px;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .glass-panel {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,255,247,0.3), 0 0 40px rgba(255,0,255,0.3);
    }

    .qr img {
      border: 4px solid #00fff7;
      border-radius: 12px;
      box-shadow: 0 0 20px #00fff7, 0 0 40px #00fff7;
      max-width: 200px;
      width: 100%;
      height: auto;
    }

    .changelog h2 {
      color: #00fff7;
      text-shadow: 0 0 10px #00fff7;
    }

    .changelog ul {
      list-style: none;
      padding: 0;
    }

    .changelog li {
      margin: 10px 0;
      padding: 8px;
      background: rgba(0,255,247,0.1);
      border-left: 4px solid #ff00ff;
      border-radius: 6px;
    }
  </style>
</head>
