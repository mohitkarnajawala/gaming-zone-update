name: Update Landing Page

on:
  release:
    types: [published]

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Extract release info
        run: |
          echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          echo "APK_URL=${{ github.event.release.assets[0].browser_download_url }}" >> $GITHUB_ENV
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.release.body }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update index.html
        run: |
          sed -i "s/{{VERSION}}/${VERSION}/g" index.html
          sed -i "s|{{APK_URL}}|${APK_URL}|g" index.html
          FORMATTED=$(echo "$NOTES" | sed 's/^/<li>/;s/$/<\/li>/' | sed ':a;N;$!ba;s/\n/<\/li>\n<li>/g')
          sed -i "s|{{CHANGELOG}}|$FORMATTED|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
